<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA S2 Deliveroo - Obwodnica Warszafki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="background-music" src="background.wav" loop></audio>

<div id="ui-container">
    <div class="panel">
        <h3 class="collapsible-header" onclick="toggleSection('sterowanie')">
            <span class="toggle-icon" id="sterowanie-icon">▼</span> Sterowanie
        </h3>
        <div id="sterowanie-content" class="collapsible-content">
            <div><kbd>↑</kbd> Gaz</div>
            <div><kbd>↓</kbd> Wsteczny</div>
            <div><kbd>←</kbd> <kbd>→</kbd> Kierownica (Precyzyjna)</div>
            <div><kbd>Spacja</kbd> Hamulec</div>
        </div>
    </div>

    <div class="panel">
        <h3 class="collapsible-header" onclick="toggleSection('poziomy')">
            <span class="toggle-icon" id="poziomy-icon">▼</span> Poziomy
        </h3>
        <div id="poziomy-content" class="collapsible-content">
            <div id="levels-container">
                <!-- Przyciski poziomów będą generowane tutaj dynamicznie -->
            </div>

            <div style="margin-top:15px; border-top: 1px solid #555; padding-top:10px;">
                <div class="stat-row">Prędkość: <span class="stat-val" id="ui-speed">0 km/h</span></div>
                <div class="stat-row">Skręt: <span class="stat-val" id="ui-steer">0°</span></div>
                <div class="stat-row">Silnik: <span class="stat-val" id="ui-engine">ON</span></div>
                <div class="stat-row">Światła: <span class="stat-val" id="ui-lights">ON</span></div>
                <div class="stat-row">Poślizg: <span class="stat-val" id="ui-drift" style="color: #3498db;">NIE</span></div>
                <div class="stat-row">Boost: <span class="stat-val" id="ui-boost" style="color: #95a5a6;">0%</span></div>
                <button class="mode-btn" id="toggle-steering-mode" onclick="game.player.toggleSteeringMode()">Asystent Kierownicy: WŁ</button>
                <button class="mode-btn" id="toggle-winter-mode" onclick="game.player.toggleWinterMode()">Poślizgi Zimowe: WYŁ</button>
                <button class="mode-btn" id="toggle-music-btn" onclick="game.toggleBackgroundMusic()">Dźwięk: WŁ</button>
            </div>
        </div>
    </div>
</div>

<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
</div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/geometry.js"></script>
<script src="js/obstacles.js"></script>
<script src="js/cars.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
